<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agile Planner</h1>
            <p>Персональный планировщик задач</p>
        </header>

        <section class="task-form">
            <h2>Новая задача</h2>
            <input type="text" id="task-title" placeholder="Название задачи">
            <textarea id="task-description" placeholder="Описание задачи"></textarea>

            <select id="task-priority">
                <option value="Низкий">Низкий приоритет</option>
                <option value="Средний" selected>Средний приоритет</option>
                <option value="Высокий">Высокий приоритет</option>
            </select>

            <button id="add-task">Добавить задачу</button>
        </section>

        <section class="tasks">
            <h2>Мои задачи</h2>
            <div class="filters">
                <button data-filter="all">Все</button>
                <button data-filter="To Do">К выполнению</button>
                <button data-filter="In Progress">В работе</button>
                <button data-filter="Done">Выполнено</button>
            </div>
            <div id="task-list"></div>
        </section>

        <section class="progress">
            <h2>Прогресс</h2>
            <p id="progress-text">Выполнено задач: 0 из 0</p>
            <progress id="progress-bar" value="0" max="100"></progress>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
